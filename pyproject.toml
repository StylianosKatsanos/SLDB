[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sldb"
version = "0.1.0"
description = "Compliance project rollout client and single-line diagram (SLD) database editor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5",      # Qt user interface (DB Client and SLD editor)
    "pandas>=2.0",       # SLD CSV export and the project schedule export
    "numpy>=1.24",       # client/create_schedule.py
    "tabulate>=0.9",     # client/create_schedule.py
    "XlsxWriter>=3.0",   # Excel engine used by pandas for Project_Schedule.xlsx
    "pytest>=7.0"
]

[tool.setuptools.packages.find]
# Only the application code; ClientDatabase/ and "V4 - SLD Integration/" are not packages.
include = ["client*", "config*", "sld*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
